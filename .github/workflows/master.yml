on: 
  push:
    branches:
      - master
name: 🚀 Deploy website on push
jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4
    
    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: 📥 Install dependencies
      run: npm ci
    
    - name: 🏗️ Build project
      # run: npm run build
      run: npm run generate
      env:
        NUXT_PUBLIC_API_BASE: ${{ vars.NUXT_PUBLIC_API_BASE }}
    
    - name: ⚙️ Set rsync switches
      id: rsync_switches
      run: |
        EXCLUDES="--exclude='.env' --exclude='vendor/'"
        if echo "${{ github.event.head_commit.message }}" | grep -qi "\[force\]"; then
          echo "switches=-rlvz --delete --omit-dir-times --no-perms --ignore-times $EXCLUDES" >> $GITHUB_OUTPUT
          echo "Deploy FORÇADO: todos os arquivos serão enviados"
        else
          echo "switches=-rlvz --delete --omit-dir-times --no-perms $EXCLUDES" >> $GITHUB_OUTPUT
          echo "Deploy incremental: apenas arquivos alterados"
        fi

    - name: 📂 Deploy via rsync SSH
      uses: burnett01/rsync-deployments@7.0.1
      with:
        switches: ${{ steps.rsync_switches.outputs.switches }}
        path: ./.output/public/
        remote_path: /home/identificatransito/htdocs/www.identificatransito.com.br/public/aprovacao/
        remote_host: ${{ secrets.SSH_HOST }}
        remote_user: ${{ secrets.SSH_USERNAME }}
        remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
        remote_port: ${{ secrets.SSH_PORT }}